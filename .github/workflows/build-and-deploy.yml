name: Build and Deploy

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install XML parser
        run: npm install fast-xml-parser

      - name: Fetch RSS and create news.json
        run: node fetch-rss.js

      - name: Verify news.json
        run: |
          if [ ! -f news.json ]; then
            echo "❌ ERROR: news.json was not created!"
            exit 1
          fi
          echo "✅ news.json size: $(wc -c < news.json) bytes"
          echo "=== First 300 chars of news.json ==="
          head -c 300 news.json
          echo ""

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
