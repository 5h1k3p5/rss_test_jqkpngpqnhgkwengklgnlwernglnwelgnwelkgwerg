<iframe id="ria-news" style="width:100%;height:100%; border:none; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,0.15);" srcdoc="
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }
  
  .wrapper {
    width: 90%;
    max-width: 1400px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  .news {
    display: flex;
    align-items: center;
    gap: 30px;
    opacity: 1;
    transition: opacity 0.6s ease;
    width: 100%;
  }
  .news.fade { opacity: 0; }

  /* Левая колонка: логотип + картинка */
  .left {
    flex-shrink: 0;
    width: 420px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  
  .logo {
    width: 100%;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
  }
  .logo img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  
  .img {
    width: 100%;
    height: 320px;
    border-radius: 12px;
    overflow: hidden;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex; 
    align-items: center; 
    justify-content: center;
    color: #fff; 
    font-size: 80px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  }
  .img img { 
    width:100%; 
    height:100%; 
    object-fit:cover; 
    display:block; 
  }

  /* Правая колонка: текст */
  .text { 
    flex:1; 
    min-width:0; 
    padding-left: 10px;
  }
  
  .title {
    font-size: 32px;
    font-weight: 700;
    color: #1a1a1a;
    line-height: 1.3;
    margin-bottom: 20px;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .title a { 
    color:inherit; 
    text-decoration:none; 
  }
  .title a:hover { 
    color:#d32f2f; 
  }
  
  .description {
    font-size: 20px;
    color: #555;
    line-height: 1.6;
    margin-bottom: 20px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  
  .date { 
    font-size: 18px; 
    color: #888;
    font-weight: 500;
  }
  
  .loader { 
    text-align:center; 
    padding:80px 0; 
    color:#888; 
    font-size:24px; 
  }
  
  .err { 
    text-align:center; 
    padding:60px 20px; 
    color:#d32f2f; 
    font-size:20px; 
  }

  @media (max-width: 1200px) {
    .left { width: 350px; }
    .img { height: 260px; }
    .title { font-size: 26px; }
    .description { font-size: 18px; }
  }
  
  @media (max-width: 900px) {
    .news { flex-direction: column; }
    .left { width:100%; max-width:600px; }
    .img { height: 300px; }
    .text { padding-left: 0; padding-top: 10px; }
    .title { font-size: 24px; -webkit-line-clamp: 3; }
  }
</style>
</head>
<body>
  <div class="wrapper">
    <div id="box"><div class="loader">Загрузка новостей...</div></div>
  </div>
  
<script>
const RSS = "https://ria.ru/export/rss2/archive/index.xml";
const API = "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(RSS);
const LOGO = "https://россиясегодня.рф/i/logo/logo-ria.svg?2";

let items = [];
let idx = 0;
let timer = null;

function extractImage(it) {
  if (it.enclosure && it.enclosure.link) return it.enclosure.link;
  if (it.thumbnail) return it.thumbnail;
  const html = it.content || it.description || "";
  const m = html.match(/<img[^>]+src=["\x27]([^"\x27]+)["\x27]/);
  return m ? m[1] : null;
}

function stripHtml(html) {
  const tmp = document.createElement("div");
  tmp.innerHTML = html;
  return tmp.textContent || tmp.innerText || "";
}

function fmtDate(s) {
  return new Date(s).toLocaleString("ru-RU", {
    day:"numeric", 
    month:"long", 
    year:"numeric",
    hour:"2-digit", 
    minute:"2-digit"
  });
}

function render() {
  if (!items.length) return;
  const it = items[idx];
  const img = extractImage(it);
  const desc = stripHtml(it.description).substring(0, 250);
  const box = document.getElementById("box");
  box.classList.add("fade");

  setTimeout(() => {
    box.innerHTML = `
      <div class="news">
        <div class="left">
          <div class="logo"><img src="${LOGO}" alt="РИА Новости"></div>
          <div class="img">
            ${img ? `<img src="${img}" onerror="this.remove();this.parentElement.innerHTML=\x27📰\x27;">` : "📰"}
          </div>
        </div>
        <div class="text">
          <div class="title"><a href="${it.link}" target="_blank">${it.title}</a></div>
          <div class="description">${desc}</div>
          <div class="date">🕐 ${fmtDate(it.pubDate)}</div>
        </div>
      </div>`;
    box.classList.remove("fade");
    idx = (idx + 1) % items.length;
  }, 600);
}

async function load() {
  try {
    const r = await fetch(API);
    const d = await r.json();
    if (d.status !== "ok") throw new Error("Ошибка загрузки RSS");
    items = d.items.filter(i => extractImage(i)).slice(0, 30);
    if (!items.length) throw new Error("Нет новостей с картинками");
    idx = Math.floor(Math.random() * items.length);
    render();
    if (timer) clearInterval(timer);
    timer = setInterval(render, 10000);
  } catch (e) {
    document.getElementById("box").innerHTML = `<div class="err">⚠️ ${e.message}</div>`;
  }
}

load();
setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
'></iframe>
