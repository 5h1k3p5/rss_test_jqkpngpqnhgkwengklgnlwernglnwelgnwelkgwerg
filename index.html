<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
}
.wrapper { width: 90%; max-width: 1400px; display: flex; align-items: center; justify-content: center; }
.news { display: flex; align-items: center; gap: 30px; opacity: 1; transition: opacity 0.6s ease; width: 100%; }
.news.fade { opacity: 0; }
.left { flex-shrink: 0; width: 420px; display: flex; flex-direction: column; gap: 16px; }
.logo { width: 100%; height: 60px; display: flex; align-items: center; justify-content: center; background: #fff; }
.logo img { max-width: 100%; max-height: 100%; object-fit: contain; }
.img { width: 100%; height: 320px; border-radius: 12px; overflow: hidden; background: linear-gradient(135deg, #667eea, #764ba2); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 80px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
.img img { width:100%; height:100%; object-fit:cover; display:block; }
.text { flex:1; min-width:0; padding-left: 10px; }
.title { font-size: 32px; font-weight: 700; color: #1a1a1a; line-height: 1.3; margin-bottom: 20px; }
.title a { color:inherit; text-decoration:none; }
.title a:hover { color:#d32f2f; }
.description { font-size: 20px; color: #555; line-height: 1.6; margin-bottom: 20px; }
.date { font-size: 18px; color: #888; font-weight: 500; }
.loader { text-align:center; padding:80px 0; color:#888; font-size:24px; }
.err { text-align:center; padding:60px 20px; color:#d32f2f; font-size:20px; }
@media (max-width: 1200px) { .left { width: 350px; } .img { height: 260px; } .title { font-size: 26px; } .description { font-size: 18px; } }
@media (max-width: 900px) { .news { flex-direction: column; } .left { width:100%; max-width:600px; } .img { height: 300px; } .text { padding-left: 0; padding-top: 10px; } .title { font-size: 24px; } }
</style>
</head>
<body>
<div class="wrapper">
    <div id="box"><div class="loader">Загрузка новостей...</div></div>
</div>
<script>
const RSS_URL = "http://inibroker.com/rss-feed-263557395681.xml";
const LOGO = "https://optim.tildacdn.com/tild3163-3431-4435-b830-363730373233/-/resize/343x/-/format/webp/isb_logo_rus.png.webp";

let items = [];
let idx = 0;
let timer = null;

// Все прокси, которые точно работают с GitHub Pages (отдают CORS-заголовки)
const PROXIES = [
    {
        name: "Jina Reader",
        url: (u) => `https://r.jina.ai/${u}`,
        headers: { "X-Return-Format": "text", "Accept": "application/xml" },
        parse: (r) => r.text()
    },
    {
        name: "AllOrigins GET",
        url: (u) => `https://api.allorigins.win/get?url=${encodeURIComponent(u)}`,
        headers: {},
        parse: async (r) => { const d = await r.json(); return d.contents; }
    },
    {
        name: "AllOrigins RAW",
        url: (u) => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
        headers: {},
        parse: (r) => r.text()
    },
    {
        name: "CorsProxy.io",
        url: (u) => `https://corsproxy.io/?${encodeURIComponent(u)}`,
        headers: {},
        parse: (r) => r.text()
    }
];

async function fetchRSS() {
    const urls = [
        RSS_URL.replace("http://", "https://"),
        RSS_URL
    ];
    
    const tasks = [];
    for (const rssUrl of urls) {
        for (const proxy of PROXIES) {
            tasks.push({
                name: `${proxy.name} [${rssUrl.substring(0, 30)}...]`,
                promise: (async () => {
                    const r = await fetch(proxy.url(rssUrl), { headers: proxy.headers });
                    if (!r.ok) throw new Error(`HTTP ${r.status}`);
                    const text = await proxy.parse(r);
                    if (!text || text.length < 200) throw new Error("Пустой ответ");
                    if (!text.includes("<item") && !text.includes("<entry")) {
                        throw new Error("Ответ не содержит RSS-элементов");
                    }
                    return text;
                })()
            });
        }
    }
    
    console.log(`🚀 Запускаем ${tasks.length} параллельных запросов...`);
    
    // Promise.any возвращает ПЕРВЫЙ успешный результат
    try {
        const xml = await Promise.any(tasks.map(t => t.promise));
        return xml;
    } catch (aggErr) {
        const errors = aggErr.errors || [];
        console.error("❌ Все прокси упали:");
        errors.forEach((e, i) => console.error(`  ${i+1}.`, e.message));
        throw new Error(`Все ${tasks.length} прокси недоступны (см. консоль)`);
    }
}

function parseRSS(xmlString) {
    // Оборачиваем в <root>, если XML-декларация мешает парсеру
    let cleanXml = xmlString.trim();
    if (!cleanXml.startsWith("<?xml")) {
        cleanXml = `<root>${cleanXml}</root>`;
    }
    
    const parser = new DOMParser();
    const doc = parser.parseFromString(cleanXml, "text/xml");
    
    if (doc.querySelector("parsererror")) {
        // Пробуем без обёртки
        const doc2 = parser.parseFromString(xmlString, "text/xml");
        if (doc2.querySelector("parsererror")) throw new Error("Не удалось распарсить XML");
    }
    
    const result = [];
    const entries = doc.querySelectorAll("item, entry");
    
    entries.forEach(entry => {
        const getText = (sel) => {
            const el = entry.querySelector(sel);
            return el ? (el.textContent || "").trim() : "";
        };
        
        const title = getText("title");
        let link = getText("link");
        if (!link) {
            const le = entry.querySelector("link");
            if (le) link = le.getAttribute("href") || "";
        }
        const description = getText("description") || getText("content") || getText("summary");
        const pubDate = getText("pubDate") || getText("published") || getText("updated") || getText("dc\\:date");
        
        let image = null;
        const enc = entry.querySelector("enclosure");
        if (enc && enc.getAttribute("url")) image = enc.getAttribute("url");
        if (!image) {
            const m = description.match(/<img[^>]+src=["']([^"']+)["']/i);
            if (m) image = m[1];
        }
        
        if (title || link) {
            result.push({ title, link, description, pubDate, image });
        }
    });
    
    return result;
}

function smartTruncate(text, maxLength) {
    if (!text || text.length <= maxLength) return text;
    const punctIndex = Math.max(
        text.lastIndexOf('.', maxLength),
        text.lastIndexOf('!', maxLength),
        text.lastIndexOf('?', maxLength)
    );
    if (punctIndex > maxLength * 0.6) return text.substring(0, punctIndex + 1);
    const spaceIndex = text.lastIndexOf(' ', maxLength);
    if (spaceIndex > maxLength * 0.6) return text.substring(0, spaceIndex) + '...';
    return text.substring(0, maxLength) + '...';
}

function stripHtml(html) {
    const tmp = document.createElement("div");
    tmp.innerHTML = html;
    return tmp.textContent || tmp.innerText || "";
}

function fmtDate(s) {
    if (!s) return "";
    const d = new Date(s);
    if (isNaN(d.getTime())) return "";
    return d.toLocaleString("ru-RU", {
        day:"numeric", month:"long", year:"numeric",
        hour:"2-digit", minute:"2-digit"
    });
}

function render() {
    if (!items.length) return;
    const it = items[idx];
    const desc = smartTruncate(stripHtml(it.description || ""), 320);
    const title = smartTruncate(it.title || "", 150);
    
    const box = document.getElementById("box");
    box.classList.add("fade");
    
    setTimeout(() => {
        box.innerHTML = `
        <div class="news">
            <div class="left">
                <div class="logo"><img src="${LOGO}" alt="Логотип"></div>
                <div class="img">
                    ${it.image 
                        ? `<img src="${it.image}" onerror="this.style.display='none'; this.parentElement.innerHTML='📰';">` 
                        : "📰"}
                </div>
            </div>
            <div class="text">
                <div class="title"><a href="${it.link}" target="_blank">${title}</a></div>
                <div class="description">${desc}</div>
                <div class="date">🕐 ${fmtDate(it.pubDate)}</div>
            </div>
        </div>`;
        box.classList.remove("fade");
        idx = (idx + 1) % items.length;
    }, 600);
}

async function load() {
    try {
        const xmlString = await fetchRSS();
        const allItems = parseRSS(xmlString);
        
        if (!allItems.length) throw new Error("В RSS не найдено ни одной записи");
        
        const TWO_YEARS_AGO = new Date();
        TWO_YEARS_AGO.setFullYear(TWO_YEARS_AGO.getFullYear() - 2);
        
        items = allItems.filter(i => {
            if (!i.pubDate) return true;
            const d = new Date(i.pubDate);
            return !isNaN(d.getTime()) && d >= TWO_YEARS_AGO;
        }).slice(0, 50);
        
        if (!items.length) {
            throw new Error(`Загружено ${allItems.length} записей, но все старше 2 лет`);
        }
        
        console.log(`✅ Всего новостей: ${allItems.length}, после фильтра (2 года): ${items.length}`);
        
        idx = Math.floor(Math.random() * items.length);
        render();
        
        if (timer) clearInterval(timer);
        timer = setInterval(render, 10000);
    } catch (e) {
        document.getElementById("box").innerHTML = `<div class="err">⚠️ ${e.message}</div>`;
    }
}

load();
setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
