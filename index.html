<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
}
.wrapper { width: 90%; max-width: 1400px; display: flex; align-items: center; justify-content: center; }
.news { display: flex; align-items: center; gap: 30px; opacity: 1; transition: opacity 0.6s ease; width: 100%; }
.news.fade { opacity: 0; }
.left { flex-shrink: 0; width: 420px; display: flex; flex-direction: column; gap: 16px; }
.logo { width: 100%; height: 60px; display: flex; align-items: center; justify-content: center; background: #fff; }
.logo img { max-width: 100%; max-height: 100%; object-fit: contain; }
.img { width: 100%; height: 320px; border-radius: 12px; overflow: hidden; background: linear-gradient(135deg, #667eea, #764ba2); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 80px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
.img img { width:100%; height:100%; object-fit:cover; display:block; }
.text { flex:1; min-width:0; padding-left: 10px; }
.title { font-size: 32px; font-weight: 700; color: #1a1a1a; line-height: 1.3; margin-bottom: 20px; }
.title a { color:inherit; text-decoration:none; }
.title a:hover { color:#d32f2f; }
.description { font-size: 20px; color: #555; line-height: 1.6; margin-bottom: 20px; }
.date { font-size: 18px; color: #888; font-weight: 500; }
.loader { text-align:center; padding:80px 0; color:#888; font-size:24px; }
.err { text-align:center; padding:60px 20px; color:#d32f2f; font-size:20px; }
@media (max-width: 1200px) { .left { width: 350px; } .img { height: 260px; } .title { font-size: 26px; } .description { font-size: 18px; } }
@media (max-width: 900px) { .news { flex-direction: column; } .left { width:100%; max-width:600px; } .img { height: 300px; } .text { padding-left: 0; padding-top: 10px; } .title { font-size: 24px; } }
</style>
</head>
<body>
<div class="wrapper">
    <div id="box"><div class="loader">Загрузка новостей...</div></div>
</div>
<script>
const RSS_URL = "http://inibroker.com/rss-feed-263557395681.xml";
const LOGO = "https://optim.tildacdn.com/tild3163-3431-4435-b830-363730373233/-/resize/343x/-/format/webp/isb_logo_rus.png.webp";

let items = [];
let idx = 0;
let timer = null;

// Ключевое: Jina Reader - почти всегда работает, даже с file://
// Формат: https://r.jina.ai/http://example.com
async function fetchRSS() {
    const jinaUrl = `https://r.jina.ai/${RSS_URL}`;
    
    try {
        console.log("Попытка через Jina Reader...");
        const response = await fetch(jinaUrl, {
            headers: {
                'Accept': 'application/xml, text/xml, */*',
                'X-Return-Format': 'text'
            }
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const text = await response.text();
        if (text && text.length > 100 && text.includes('<item>')) {
            console.log("✅ Jina Reader сработал");
            return text;
        }
        throw new Error("Jina вернул не XML");
    } catch (e) {
        console.warn("Jina Reader не сработал:", e);
    }
    
    // Фоллбэк: пробуем allorigins (только если запущено через http://)
    try {
        const alloriginsUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(RSS_URL)}`;
        const r = await fetch(alloriginsUrl);
        const d = await r.json();
        if (d && d.contents) {
            console.log("✅ AllOrigins сработал");
            return d.contents;
        }
    } catch (e) {
        console.warn("AllOrigins не сработал:", e);
    }
    
    throw new Error("Все прокси недоступны. Запустите файл через локальный сервер (python -m http.server 8000)");
}

function parseRSS(xmlString) {
    const parser = new DOMParser();
    const doc = parser.parseFromString(xmlString, "text/xml");
    if (doc.querySelector("parsererror")) throw new Error("Ошибка парсинга XML");
    
    const result = [];
    const entries = doc.querySelectorAll("item");
    
    entries.forEach(entry => {
        const getText = (selector) => {
            const el = entry.querySelector(selector);
            return el ? (el.textContent || "").trim() : "";
        };
        
        const title = getText("title");
        const link = getText("link");
        const description = getText("description");
        const pubDate = getText("pubDate");
        
        let image = null;
        const enclosure = entry.querySelector("enclosure");
        if (enclosure && enclosure.getAttribute("url")) {
            image = enclosure.getAttribute("url");
        }
        if (!image) {
            const m = description.match(/<img[^>]+src=["']([^"']+)["']/i);
            if (m) image = m[1];
        }
        
        if (title || link) {
            result.push({ title, link, description, pubDate, image });
        }
    });
    
    return result;
}

function smartTruncate(text, maxLength) {
    if (!text || text.length <= maxLength) return text;
    const punctIndex = Math.max(
        text.lastIndexOf('.', maxLength),
        text.lastIndexOf('!', maxLength),
        text.lastIndexOf('?', maxLength)
    );
    if (punctIndex > maxLength * 0.6) return text.substring(0, punctIndex + 1);
    const spaceIndex = text.lastIndexOf(' ', maxLength);
    if (spaceIndex > maxLength * 0.6) return text.substring(0, spaceIndex) + '...';
    return text.substring(0, maxLength) + '...';
}

function stripHtml(html) {
    const tmp = document.createElement("div");
    tmp.innerHTML = html;
    return tmp.textContent || tmp.innerText || "";
}

function fmtDate(s) {
    if (!s) return "";
    const d = new Date(s);
    if (isNaN(d.getTime())) return "";
    return d.toLocaleString("ru-RU", {
        day:"numeric", month:"long", year:"numeric",
        hour:"2-digit", minute:"2-digit"
    });
}

function render() {
    if (!items.length) return;
    const it = items[idx];
    const rawDesc = stripHtml(it.description || "");
    const desc = smartTruncate(rawDesc, 320);
    const title = smartTruncate(it.title || "", 150);
    
    const box = document.getElementById("box");
    box.classList.add("fade");
    
    setTimeout(() => {
        box.innerHTML = `
        <div class="news">
            <div class="left">
                <div class="logo"><img src="${LOGO}" alt="Логотип"></div>
                <div class="img">
                    ${it.image 
                        ? `<img src="${it.image}" onerror="this.style.display='none'; this.parentElement.innerHTML='📰';">` 
                        : "📰"}
                </div>
            </div>
            <div class="text">
                <div class="title"><a href="${it.link}" target="_blank">${title}</a></div>
                <div class="description">${desc}</div>
                <div class="date">🕐 ${fmtDate(it.pubDate)}</div>
            </div>
        </div>`;
        box.classList.remove("fade");
        idx = (idx + 1) % items.length;
    }, 600);
}

async function load() {
    try {
        const xmlString = await fetchRSS();
        const allItems = parseRSS(xmlString);
        
        if (!allItems.length) throw new Error("В RSS не найдено ни одной записи");
        
        const TWO_YEARS_AGO = new Date();
        TWO_YEARS_AGO.setFullYear(TWO_YEARS_AGO.getFullYear() - 2);
        
        items = allItems.filter(i => {
            if (!i.pubDate) return true;
            const pubDate = new Date(i.pubDate);
            return !isNaN(pubDate.getTime()) && pubDate >= TWO_YEARS_AGO;
        });
        
        if (!items.length) throw new Error(`Загружено ${allItems.length} записей, но все старше 2 лет`);
        
        console.log(`✅ Всего новостей: ${allItems.length}, после фильтра (2 года): ${items.length}`);
        
        idx = Math.floor(Math.random() * items.length);
        render();
        
        if (timer) clearInterval(timer);
        timer = setInterval(render, 10000);
    } catch (e) {
        document.getElementById("box").innerHTML = `<div class="err">⚠️ ${e.message}</div>`;
    }
}

load();
setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
