<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Новости</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow-x: hidden;
    padding: 20px 0;
}

.wrapper {
    width: 90%;
    max-width: 1200px;
}

.news {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    opacity: 1;
    transition: opacity 0.6s ease;
}
.news.fade { opacity: 0; }

.content-row {
    display: flex;
    gap: 30px;
    width: 100%;
    align-items: stretch;
    justify-content: center;
}

.left {
    flex-shrink: 0;
    width: 420px;
    display: flex;
    flex-direction: column;
    gap: 16px; /* Отступ между логотипом и картинкой */
}

.logo {
    width: 100%;
    height: 70px; /* Высота логотипа на десктопе */
    display: flex;
    align-items: center;
    justify-content: flex-start;
    background: #fff;
}
.logo img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
}

.img {
    width: 100%;
    height: 320px;
    border-radius: 12px;
    overflow: hidden;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 80px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}
.img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* ТЕКСТОВЫЙ БЛОК */
.text {
    flex: 1;
    min-width: 0;
    max-width: 600px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    /* КЛЮЧЕВОЕ: отступ сверху = высота логотипа + gap, чтобы текст начинался на уровне картинки */
    padding-top: calc(70px + 16px);
}

.title {
    font-size: 28px;
    font-weight: 700;
    color: #1a1a1a;
    line-height: 1.3;
    word-wrap: break-word;
    overflow-wrap: break-word;
}
.title a {
    color: inherit;
    text-decoration: none;
}
.title a:hover {
    color: #d32f2f;
}

.description {
    font-size: 18px;
    color: #555;
    line-height: 1.55;
    word-wrap: break-word;
    overflow-wrap: break-word;
    flex: 1;
    display: flex;
    align-items: center;
}

.date {
    font-size: 16px;
    color: #888;
    font-weight: 500;
}

.loader {
    text-align: center;
    padding: 80px 0;
    color: #888;
    font-size: 24px;
}
.err {
    text-align: center;
    padding: 60px 20px;
    color: #d32f2f;
    font-size: 20px;
}

/* === АДАПТИВНОСТЬ === */

/* Планшеты и небольшие десктопы */
@media (max-width: 1200px) {
    .left { width: 350px; }
    .logo { height: 60px; }
    .img { height: 280px; }
    .text { padding-top: calc(60px + 16px); } /* 76px */
    .title { font-size: 24px; }
    .description { font-size: 17px; }
    .content-row { gap: 25px; }
}

/* Мобильные — портрет */
@media (max-width: 768px) {
    body { padding: 15px 0; }
    .wrapper { width: 92%; }
    .content-row { gap: 18px; }
    .left { width: 45%; }
    .logo { height: 55px; }
    .text { padding-top: calc(55px + 16px); } /* 71px */
    .img {
        height: auto;
        aspect-ratio: 4 / 3;
    }
    .title { font-size: 18px; line-height: 1.25; }
    .description { font-size: 14px; line-height: 1.45; }
    .date { font-size: 13px; }
}

/* Мобильные в ландшафтном режиме */
@media (max-width: 768px) and (orientation: landscape) {
    body { padding: 10px 0; }
    .content-row { gap: 15px; }
    .left { width: 42%; }
    .logo { height: 45px; }
    .text { padding-top: calc(45px + 16px); } /* 61px */
    .img { aspect-ratio: 16 / 10; }
    .title { font-size: 16px; line-height: 1.2; }
    .description { font-size: 13px; line-height: 1.4; }
    .date { font-size: 12px; }
}

/* Очень маленькие телефоны (ширина < 400px) */
@media (max-width: 400px) {
    .left { width: 40%; }
    .logo { height: 40px; }
    .text { padding-top: calc(40px + 16px); } /* 56px */
    .title { font-size: 16px; }
    .description { font-size: 13px; }
    .date { font-size: 12px; }
    .content-row { gap: 12px; }
}
</style>
</head>
<body>
<div class="wrapper">
    <div id="box"><div class="loader">Загрузка новостей...</div></div>
</div>
<script>
const LOGO = "https://xn--c1acbl2abdlkab1og.xn--p1ai/i/logo/logo-ria.svg?2";

let items = [];
let idx = 0;
let timer = null;

function isSmallScreen() {
    return window.matchMedia('(max-width: 768px)').matches;
}
function isLandscapeMobile() {
    return window.matchMedia('(max-width: 768px) and (orientation: landscape)').matches;
}

function smartTruncate(text, maxLength) {
    if (!text || text.length <= maxLength) return text;
    const punctIndex = Math.max(
        text.lastIndexOf('.', maxLength),
        text.lastIndexOf('!', maxLength),
        text.lastIndexOf('?', maxLength)
    );
    if (punctIndex > maxLength * 0.6) return text.substring(0, punctIndex + 1);
    const spaceIndex = text.lastIndexOf(' ', maxLength);
    if (spaceIndex > maxLength * 0.6) return text.substring(0, spaceIndex) + '...';
    return text.substring(0, maxLength) + '...';
}

function stripHtml(html) {
    const tmp = document.createElement("div");
    tmp.innerHTML = html;
    return tmp.textContent || tmp.innerText || "";
}

function fmtDate(s) {
    if (!s) return "";
    const d = new Date(s);
    if (isNaN(d.getTime())) return "";
    return d.toLocaleString("ru-RU", {
        day: "numeric", month: "long", year: "numeric",
        hour: "2-digit", minute: "2-digit"
    });
}

function render() {
    if (!items.length) return;
    const it = items[idx];

    let descLength = 320;
    if (isLandscapeMobile()) descLength = 150;
    else if (isSmallScreen()) descLength = 200;

    const desc = smartTruncate(stripHtml(it.description || ""), descLength);
    const title = it.title || "";

    const box = document.getElementById("box");
    box.classList.add("fade");

    setTimeout(() => {
        box.innerHTML = `
        <div class="news">
            <div class="content-row">
                <div class="left">
                    <div class="logo">
                        <img src="${LOGO}" alt="Логотип">
                    </div>
                    <div class="img">
                        ${it.image
                            ? `<img src="${it.image}" onerror="this.style.display='none'; this.parentElement.innerHTML='📰';">`
                            : "📰"}
                    </div>
                </div>
                <div class="text">
                    <div class="title"><a href="${it.link}" target="_blank">${title}</a></div>
                    <div class="description">${desc}</div>
                    <div class="date">🕐 ${fmtDate(it.pubDate)}</div>
                </div>
            </div>
        </div>`;
        box.classList.remove("fade");
        idx = (idx + 1) % items.length;
    }, 600);
}

async function load() {
    try {
        const r = await fetch(`news.json?t=${Date.now()}`);
        if (!r.ok) throw new Error("HTTP " + r.status + " при загрузке news.json");
        items = await r.json();
        if (!items.length) throw new Error("Список новостей пуст");
        console.log("✅ Загружено новостей:", items.length);
        idx = Math.floor(Math.random() * items.length);
        render();
        if (timer) clearInterval(timer);
        timer = setInterval(render, 15000);
    } catch (e) {
        document.getElementById("box").innerHTML = `<div class="err">⚠️ ${e.message}</div>`;
    }
}

window.addEventListener('orientationchange', () => setTimeout(render, 100));
window.addEventListener('resize', () => {
    clearTimeout(window._resizeTimer);
    window._resizeTimer = setTimeout(render, 200);
});

load();
setInterval(load, 30 * 60 * 1000);
</script>
</body>
</html>
